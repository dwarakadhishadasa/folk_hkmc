- id: "10"
  title: Interaction boundaries, accessibility, and the recorded visual pass
  description: >-
    CAP-16, CAP-8 and CAP-9. Verifies the seven interaction boundaries hold
    together, that every control is labelled and keyboard-reachable, and that
    scope preservation still passes after all nine stories.
  done_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md CAP-8, CAP-9 and CAP-16, surface-and-toolbar.md, the "What
    must survive this work" list at the end of that file, and epics.md Story
    4.1. This is the closing gate, not new feature work.

    THE BOUNDARIES TO PROVE, each with the mechanism already in the source: a
    checkbox click activates no edit (stopPropagation); a dropdown or popover
    interaction never triggers a double-click edit — THE NEW RISK, because with
    double-click as the only opener a double-click landing on a select editor's
    popover could open the editor AND fire the cell's handler, so the cell's
    handler must check the event target is not inside [data-grid-editor]; a
    read-only field never enters edit mode (openEditor's editable guard); a
    single cell click preserves row navigation; keyboard propagation is stopped
    only where a key would be swallowed (isGuardedTarget).
    NOTE ON WHAT IS NOT HERE: there is no record panel, no per-row open
    affordance and no prev/next. CAP-5 was withdrawn on 2026-10-12, so no
    boundary is asserted against a panel and there is no row-level handler to
    guard. Do not reinstate one to satisfy a clause in an older version of this
    story.

    THE THIRTEEN-ITEM TEST LIST from the brief maps across these stories.
    Everything is asserted except item 9, visual distinctness of hover /
    active / editing / selected, which the suite CANNOT check: banning shadows
    and stripes is exactly the CSS a spec would have to hardcode, and
    hardcoded values fail the first time someone tunes a token for dark-mode
    legibility. Record a manual pass at 1440x900 and 1024x768, in light and in
    whatever theme exists, in this story file.

    PRESERVATION GATES, all of which must still hold: grep -rn "dark:"
    components/grid/ is 0; the raw-hex / rgb( / white / black grep is 0; no
    Manage* or /api/manage vocabulary under components/grid/; every data-grid-*
    attribute in e2e/fixtures/manage-grid.ts still present and still meaning
    what that file documents; all 19 matrix rows still Covered, or each retired
    row's reason recorded in matrix-coverage-map.md in the same commit; apps/
    folk and apps/gita-life mirrored with md5sum on the files meant to match;
    pnpm typecheck:workspace, pnpm lint, pnpm guardrails and pnpm test:e2e
    green.

    ALSO AUDIT, because no story owns them on its own: every write still goes
    through lib/manage/api-handlers.ts with getStaffContext + requireRole,
    validated against MANAGE_CONTACT_PATCH_KEYS, with no component talking to
    Supabase directly and no new authorization logic; and there are NO per-
    option coloured pills — no eleven pastel hues, no stable-hash palette.
    Revisiting pills requires an explicit data-* assertion surface and a
    decision on whether tone belongs to the option or the field.

    Also confirm the non-regression rule: `e`, type-to-edit and Space-seeding
    STAY GONE. If story 1's behaviour has been quietly restored, say so rather
    than shipping a green suite that tests something nobody intended to keep.

    Do NOT mount ThemeProvider — story 6 of spec-grid-keyboard-editors-and-
