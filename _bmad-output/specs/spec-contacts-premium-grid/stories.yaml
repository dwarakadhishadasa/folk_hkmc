# Story breakdown for SPEC-contacts-premium-grid.
#
# Execution order is list order. Reconciled with epics.md on 2026-10-10.
#
# Ten stories in four epics, grouped by the files each one owns so every story
# is an independently mergeable PR. Stories 2, 3 and 4 share files with their
# neighbours, which is exactly why the order is load-bearing: reordering them
# turns a clean sequence into a series of merge conflicts.
#
#   1 before everything — it changes the edit model that 3, 4, 6, 7 and 9 are
#     written against.
#   2 before 3 and 4    — grid-header-cell.tsx and grid-row.tsx overlap;
#     moving the header after the cells is a conflict waiting to happen.
#   6 after ../spec-contacts-date-types/ — its date operators are written
#     against the DATE type that spec produces. Stories 2, 3, 4 and 5 do NOT
#     touch a date column and are deliberately left outside that gate.
#   6 before 7          — the redesigned toolbar's filter control opens the
#     modal story 6 builds.
#   9 after 1 and 3     — the panel needs the commit rules and the renderers.
#
# DELTA FROM THE 8-STORY VERSION OF 2026-10-09. Three changes:
#   + story 5 (scroll container) — CAP-2's scroll half had no owner; the old
#     story 3 claimed only the empty-state half.
#   + story 8 (page header)      — CAP-1 had zero mentions across all eight.
#   ~ the Filter menu item moved from story 2 to story 6. The old story 2 told
#     the dev to add a Filter item opening a filter modal that story 5 built
#     LATER and that is gated behind spec-contacts-date-types. That ships a
#     dead control, which CAP-6 and FR6 both forbid.
#
# epics.md holds the acceptance criteria for all ten. This file holds the
# dispatch-time traps only — read both before starting a story.
#
# Environment: the primitives need no stack; /dev/grid-preview (500 synthetic
# rows) is enough to grade them. Every /manage story needs the local stack
# (pnpm dev:local) and pnpm test:e2e. One runner at a time, 5-7 minutes.

- id: "1"
  title: Double-click edit model, blur-commit, and retiring the keyboard openers
  description: >-
    CAP-10, and the foundation for CAP-7 and CAP-16. A double-click opens a
    cell editor, a second double-click commits, blur commits, Escape discards,
    and the `e` / type-to-edit / Space-seeding openers are removed.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md, surface-and-toolbar.md section CAP-10, existing-state.md in
    full, and epics.md Story 1.1 for the acceptance criteria. This story
    supersedes committed upstream behaviour and breaks roughly 95 press() calls
    across five spec files, so read it twice.

    THREE CONTRACTS IN THE SOURCE ARE REVERSED BY THIS STORY. Each is a
    comment that will become a lie unless it is rewritten in the same change:

    1. grid-editors.tsx:181-189 PopoverEditor's onOpenChange calls ctx.close()
       and says "Closing is a discard. AC4 is explicit that clicking away
       mid-edit writes nothing for every editor except checkbox." Blur-commit
       INVERTS this to a commit. select, multiselect, date and longtext all
       render through PopoverEditor, so getting this wrong silently discards
       the edit when the operator picks a dropdown option.
    2. grid-editors.tsx:195-199 stopPropagation on the popover trigger says it
       exists "so `e` and `Space` still address this column". `e` is gone — but
       KEEP THE HANDLER. Without it the cell loses the pointer and a
       double-click cannot reach the trigger at all. Rewrite the reason, do not
       delete the code.
    3. grid-editors.tsx:225-227 OpenableDisplay says "`e` opens its editor".
       Update.

    ALSO: openEditor (use-grid-keyboard.ts:841-881) seeds the draft from the
    cell's current value, so an untouched draft equals the existing value.
    Blur-commit therefore fires a PATCH on every cell click unless untouched is
    distinguished from equal. GridCellCommit documents "Unchanged text still
    commits", which is correct for inline Enter but wrong for blur. Assert zero
    requests when a cell is opened and clicked away without typing.

    CAP-7 RIDES HERE. Validation runs BEFORE the save and the typed editor
    supplies parsing and validation only — the commit path still owns the
    draft, the optimistic display and the revert. A write the server rejects
    shows the server's own message and reverts the cell. Do NOT add a second
    mutation channel to accomplish this.

    KEEP: arrow navigation, Tab/Shift+Tab, Home/End, Escape, Space-on-checkbox,
    Delete/Backspace clear. None of those open an editor, so upstream story 2's
    NAVIGATION work is untouched — only its opening work is retired. The
    tempting mistake is to strip the Space branch while removing its seeding
    half; it still toggles a checkbox.

    SPEC UPDATES, NOT DELETIONS. grid-editors.spec.ts opens editors with
    press("e") 14 times; manage-contacts-edit.spec.ts has 16 press() calls;
    grid-keyboard.spec.ts has the `e` and type-to-edit cases. Convert them to
    dblclick then keyboard.type. Record in each retired assertion WHY the
    behaviour was removed — a green suite that no longer tests the keyboard
    model is a false claim about coverage, and the next agent will trust it.
    See AGENTS.md: fixing the source is the rule, and this is one of the two
    deliberate exceptions where updating an assertion is correct.

    NEW SPECS: double-click opens on each of the seven editor types; a single
    click does NOT open; a second double-click commits; blur commits a touched
    draft; blur commits NOTHING when untouched; Escape discards; arrows and Tab
    navigate without opening an editor; Space still toggles a checkbox. Also
    confirm the read-only guard: openEditor returns false unless
    meta.grid.editable is true.

    IF THIS STORY EXCEEDS ITS CONTEXT, split it as: (a) the blur-commit
    mechanism, then (b) the retirement. Do NOT reverse that order — the
    mechanism's tests need the old openers to still exist as a baseline.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.

- id: "2"
  title: Column drag-and-drop, a clean column menu, and a contextual header affordance
  description: >-
    CAP-13, and CAP-14's structure and affordance. Reordering moves to drag via
    @dnd-kit/core and the menu control is revealed on hover and focus without
    ever hiding from touch.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md, surface-and-toolbar.md sections CAP-13 and CAP-14,
    existing-state.md, and epics.md Story 2.1. Both live in
    grid-header-cell.tsx, so this is one story by file ownership.

    THE MENU HAS THREE ITEMS IN THIS STORY, NOT FOUR. Sort ascending, Sort
    descending, Hide column. The fourth — Filter — arrives with story 6, which
    builds the filter conditions bar this story must NOT reference. A menu item
    pointing at a filter surface that does not exist yet is exactly the
    nonfunctional control CAP-6 and FR6 forbid, and it would be shipped dead.
    Do not add it. This is a deliberate change from the 8-story version of this
    breakdown, where this story told you to add it and story 5 built the modal
    later.

    @dnd-kit/core is the ONLY new dependency in the entire spec. It is not in
    package.json or pnpm-lock.yaml: add it at the workspace root with the other
    shared deps, pin the version, commit the lockfile, and confirm it resolves
    for BOTH apps/folk and apps/gita-life. It supplies pointer, touch AND
    keyboard sensors — that keyboard support is why removing Move left / Move
    right is not the accessibility regression the spec originally assumed.

    THE PINNED RUN IS THE HARD PART. dnd-kit does not know that `select` and
    `name` are frozen, so every rule the removed menu items enforced is now
    this story's job: a pinned column is not draggable; a drop ONTO a pinned
    column is rejected and the order is unchanged; and — the one that gets
    missed — any resulting order that would INTERLEAVE a scrolling column into
    the pinned run must be rejected BEFORE it is committed, not merely the drop
    target. The frozen left offsets are cumulative and derived from
    columnOrder, so a bad order yields a sticky column whose left does not
    match its real position: invisible in a screenshot, obvious when scrolling.
    Validate the resulting order, not the drop target.

    REUSE grid.tsx:773-806 moveColumn's logic — it reads the full order, steps
    while SKIPPING HIDDEN COLUMNS, no-ops when unchanged, and calls
    setColumnOrder. A naive index splice will not skip hidden columns, and a
    hidden column still holds a position in columnOrder. Commit through the
    transient handle (beginTransientChange / commitTransientChange /
    cancelTransientChange) as the column width drag at grid.tsx:456 does:
    nothing per frame, one write on drop.

    REWRITE grid-header-cell.tsx:116-120, which says reordering is used
    "rather than drag-and-drop: it is deterministic, keyboard-operable, and
    serializes straight to cols with no new dependency". All three reasons are
    overruled. A comment explaining a decision someone has reversed reads as
    current until someone rewrites it. Update docs/manage-grid-pattern.md's
    Move left / Move right section in the same commit.

    Move left / Move right and the canMoveLeft / canMoveRight props go.

    The menu control must be revealed by an opacity/visibility treatment that
    leaves it focusable and tappable, NOT display:none — a header with no
    visible menu and no hover is an unreachable feature for touch users. It is
    suppressed on the selection column and on any header supplying its own
    control.

    IF THIS STORY EXCEEDS ITS CONTEXT, split it as: (a) dnd-kit wiring plus
    pinned-run validation, then (b) menu cleanup plus the contextual reveal.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.
    Assert the three menu items, that a pinned column is not draggable, that a
    rejected drop leaves the order unchanged, and that a drag persists through
    the cols URL param.

- id: "3"
  title: Type-keyed cell renderers, linked-record labels, and blank-not-dash
  description: >-
    CAP-3 and CAP-4. Reusable renderers keyed by field type, relationships
    rendered as labels with a visible unresolved marker, and the em-dash
    placeholder removed.
  invoke_dev_with: >-
    Read SPEC.md, surface-and-toolbar.md, existing-state.md, and epics.md Story
    2.2. Also read docs/manage-grid-pattern.md for the DW-27 rules. This story
    changes cell rendering, which is exactly the operation that walks into those
    traps.

    TWO FAMILIES OF COLUMN. Stored-field columns carry meta.grid.editor and
    render through the registry. Joined accessor columns — `location` and
    `collectedBy` — have NO editor and no stored value; manage-contacts-
    table.tsx:848 returns a joined STRING. A renderer keyed on editor alone
    renders nothing for both. The field-type marker needs its own key on
    GridColumnMeta, independent of editor, because "how is this cell edited"
    and "what is this cell" are different questions.

    READ docs/manage-grid-pattern.md's DW-27 section before touching
    grid-row.tsx. A closed-state editor display must render ctx.text, never
    ctx.getValue(), and a column must never be marked editable AND supply a
    cell widget — a widget replaces the value the grid would print, and
    cell.text is where the optimistic override lives, so it silently shows the
    OLD value for the whole round trip with no error anywhere.

    BLANK-NOT-DASH: GRID_EMPTY_TEXT is the em-dash at
    use-grid-keyboard.ts:20, applied at :951 and :1753. Remove it and update
    THREE specs in the same commit — grid-keyboard.spec.ts:230,
    grid-clipboard.spec.ts:134 and :151, manage-contacts-edit.spec.ts:436.
    This is the second deliberate assertion exception; the spec is changing the
    contract, so say so in the story file.

    ONE VISUAL EMPHASIS PER ROW. No column declares a weight today, so ten
    columns at identical volume leave the identity column unreadable as
    identity. `name` carries it, expressed with weight and space — never a raw
    colour and never a per-option hue.

    LINKED RECORDS: the joins already exist. manage-contacts-table.tsx:849
    falls back to the raw id and :937 falls back to an empty string. Replace
    the id fallback with a visible UNRESOLVED marker — a contact with no
    location and a contact with a dangling location reference are different
    facts and collapsing them loses a data-quality signal. Make collectedBy
    consistent. NEVER fabricate a label: if the lookup misses, the honest
    render is "unknown location", never a guess derived from the id.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.
    grep -rn "dark:" components/grid/ must still be 0 and the raw-hex grep
    must still be 0.

- id: "4"
  title: Active-cell state and the cell-metrics contract
  description: >-
    CAP-11 and CAP-15. Makes the already-shipped active-cell state and the
    existing 32px/13px metrics an explicit contract, and fixes the density
    control so its label cannot disagree with what the grid renders.
  invoke_dev_with: >-
    Read SPEC.md, surface-and-toolbar.md section "CAP-11 and CAP-15 — what is
    already true", existing-state.md, and epics.md Story 2.3. The audit table
    there lists what already ships: isFocused is resolved from focusedColumnId
    at use-grid-keyboard.ts:1757, the active ring is per-cell at
    grid-row.tsx:208 and distinct from the row hover background at :179,
    GRID_BASE_FONT_CLASS is text-[13px] at :17, GRID_ROW_HEIGHT.default is 32
    at :20, cells are `truncate px-2 align-middle` at :205. Do NOT rewrite
    working code. This story is the contract plus the small gaps the audit
    found.

    The two real gaps: (1) the density Select shows a LABEL, so if the default
    ever changes without the control initialising from the same constant, the
    control reads "Default rows" while the grid renders dense — a visible lie;
    (2) nothing asserts that hover, active, editing and selected are visually
    DISTINCT, which is item 9 of the test list.

    OQ-4 is resolved: the default STAYS at 32px and does NOT flip to dense. The
    earlier assumption that it would is withdrawn. Dense stays a user option.

    DISCOVERABILITY (OQ-8). Double-click is the only edit opener now, so
    nothing about editing is discoverable from the keyboard any more. The
    active-cell affordance has to carry that job on its own: it must
    communicate that this cell is the target of the next keystroke. Nothing
    breaks if this is lost, which is exactly why it is written down here.

    FIXED ROW HEIGHTS ARE LOAD-BEARING. The virtualizer estimates from
    GRID_ROW_HEIGHT (grid.tsx:633). No cell may ever change its row's height;
    long text truncates and edits in a popover rather than expanding.

    ON VISUAL VERIFICATION: the suite CANNOT check appearance here.
    design-constraints.md bans shadows and stripes — exactly the CSS a spec
    would have to hardcode — and hardcoded values turn a test into a
    change-detector that fails when someone tunes a token for dark-mode
    legibility. So assert the STATE TRANSITIONS (click sets active, arrows move
    it, editing and selected coexist, no dimension change) and record a manual
    pass at 1440x900 and 1024x768 in this story file, in light and in whatever
    theme exists. ThemeProvider is still unmounted — do NOT mount it; story 6
    of spec-grid-keyboard-editors-and-theme owns that.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.

- id: "5"
  title: One scroll container, and a surface that does not clip
  description: >-
    CAP-2. The grid fills the space it is given instead of asserting
    max-h-[70vh], which is the cause of the clipped final column and the nested
    scrollbar.
  invoke_dev_with: >-
    Read SPEC.md CAP-2, surface-and-toolbar.md section CAP-2, existing-state.md,
    and epics.md Story 2.4. This story is NEW in this reconciliation: CAP-2's
    scroll half had no owner in the 8-story breakdown, where story 3 claimed
    only the empty-state half. The half that was missing is the substantive
    one.

    THE SCROLL CONTAINER IS THE WHOLE PROBLEM. grid.tsx:849 renders
    `max-h-[70vh] overflow-auto` — one container, both axes. The container
    itself is correct and must stay; a second scroll container is the classic
    way a sticky header and a frozen leading run both break. What changes is
    the VIEWPORT-HEIGHT CAP. A vh-capped inner scroller inside a page that also
    scrolls produces a viewport-height-dependent frame, and the last column's
    right edge is exactly where a horizontal scrollbar's thumb sits — which is
    why CAP-2 names both a clipped final column and a nested scrollbar. Let the
    grid fill the space it is given.

    design-constraints.md BANS SCROLL SHADOWS as the workaround, and that ban
    stands. No stripe, no heavy border, no shadow.

    DO NOT REWRITE grid-row.tsx:165-232. It is careful and correct. Keep
    `[&>td]:border-b [&>td]:border-border`, the doubled
    `[data-grid-cell-selected][data-grid-cell-selected]:bg-accent/30` attribute
    that raises specificity above the row-level `>td` rules so no !important is
    needed, the per-cell hover and selection on frozen cells (which carry their
    own opaque bg-card because they sit over what scrolls beneath), and the
    single `border-r` on the last frozen column only.

    KEEP grid.tsx emitting <table> directly. It does NOT use
    components/ui/table because that wrapper's div is a second scroll
    container.

    The header is also part of this story's surface: it must be visually
    distinct from the body via a subtle surface change — no new colour, no raw
    token.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.

- id: "6"
  title: The filter conditions bar with per-field-type operators
  description: >-
    CAP-12, and CAP-14's fourth menu item. An inline bar above the grid holds a
    list of Field/operator/value conditions joined by one all-or-nothing
    connective, where the operator list and value control both depend on the
    field's type. Replaces the per-column filter popover.
  invoke_dev_with: >-
    DEPENDS ON ../spec-contacts-date-types/ HAVING LANDED. Its date operators
    are written against the DATE type that spec produces. Read that spec's
    SPEC.md first. Stories 2, 3, 4 and 5 deliberately sit outside this gate
    because none of them touches a date column — if that gate is blocking,
    those four can proceed now.

    Read SPEC.md CAP-12 and OQ-13 and OQ-18 through OQ-21, surface-and-toolbar.md
    section CAP-12, existing-state.md, and epics.md Story 3.1.

    THIS IS AN INLINE BAR, NOT A MODAL. OQ-18 reversed the earlier modal
    decision. surface-and-toolbar.md's modal-vs-inline argument is WITHDRAWN
    and struck through — do not rebuild it, and do not reach for
    components/ui/dialog.tsx. The bar carries one row per condition
    (Field · operator · value, each with its own delete and drag handle) plus
    `+ Add condition`, and shows the matching row count LIVE as conditions are
    composed. That live count is the whole reason the bar was chosen: the
    abandoned modal design had to reconstruct it by hand inside a covering
    dialog. Do not build a second count.

    STILL ABSENT, DELIBERATELY: condition GROUPS, "Copy from another view", and
    Ask AI. All three are visible in the reference screenshot, so say why they
    are absent in the code or a later agent reading only that screenshot will
    re-add them.

    ONE CONNECTIVE GOVERNS THE WHOLE LIST — match all, or match any. The `and`
    prefix shown on later rows is driven by that single value, NOT per row. The
    list is never a mixed `A and B or C` expression, so there are no precedence
    rules and nothing to serialize in order. The visual reads as per-row; state
    in the code that it is not, or a later agent will "fix" it to match what it
    looks like.

    THIS STORY ADDS THE FOURTH MENU ITEM. The column menu now contains exactly
    Sort ascending, Sort descending, Hide column, Filter, which completes
    CAP-14. Story 2 shipped the first three deliberately, so that no item ever
    pointed at a filter surface that did not exist yet. The Filter item now
    REVEALS the bar with that column's condition pre-filled and a valid
    operator preselected — it does not open anything, and must not cover the
    grid.

    THE OPERATOR SET IS PER FIELD TYPE, in a typed registry keyed by field
    type, not a switch statement. Text: contains, does not contain, is, is not,
    is empty, is not empty. Number adds relational comparison. Date adds its
    own set plus a relative-date value select (today, yesterday, one week ago,
    one month ago, N days ago, exact date) and then a date input when exact
    date is chosen. Checkbox: one entry, SHOWN per OQ-15, with a checkbox
    value. Single and multi select: is, is not, is any of, is none of, is empty,
    is not empty, with a multi-selectable option list.

    THREE TRAPS IN THE ROWS. (1) The value control is conditional PER OPERATOR
    — is empty has no value, is any of has a list, exact date swaps in a date
    input — so every operator declares its value shape and the row renders from
    that declaration. (2) Switching field type must RESET operator and value to
    something valid; leaving `contains` on a date field, or an orphaned value,
    is the bug that silently filters nothing. Matrix row 17 asserts
    f.location round-trips, so a stale value fails there rather than quietly.
    (3) is any of on booksRead needs INTERSECTION, not the substring-per-element
    behaviour in gridGlobalFilterFn's array branch, which would make "EC"
    match "ECE".

    TWO DEFECTS THIS STORY MUST FIX, both found while settling the condition
    list shape and neither previously written down:
      OQ-20 — an EMPTY filter value cannot round-trip. grid-view-state.ts:130
        reads `raw.trim().length > 0` and :211 writes `value.length > 0`, so an
        empty value is indistinguishable from an absent one and is dropped in
        BOTH directions. `Current status · is empty` — the first condition in
        the reference screenshot — silently vanishes on reload. Already true
        today; `+ Add condition` just makes it reachable constantly.
      OQ-21 — the OPERATOR must travel inside the serialized value. f.<colId>
        today holds a bare value, so `contains` and `is` are indistinguishable
        in a URL, and no bare encoding can express `is empty` either. Use
        something like `f.status=is:` — the token is non-empty as a whole, so it
        survives the length guards. The previous derivation of this spec
        asserted round-tripping without specifying a shape that could round-trip.

    f.<colId> KEEPS its meaning — conditions in it still AND across columns, so
    matrix row 17 is untouched and existing shared URLs keep working. Match-ANY
    conditions need a new key family mirroring GRID_PARAM_PREFIXES
    (grid-view-state.ts:39). Because the connective is global, both cases are
    sets of columns: no list parser, and condition order never needs preserving.

    Relative-date presets serialize to a computed ABSOLUTE boundary (OQ-14) so
    a shared URL does not mean something different tomorrow and no assertion
    depends on the wall clock. Date fields are free-text strings: relative
    operators MUST parse to a real Date, and an unparseable value must be
    handled EXPLICITLY — a NaN comparison silently drops the row from every
    date-filtered view with no error and no failing test.

    This REMOVES the per-column popover (grid-header-cell.tsx:183-205) and with
    it meta.grid.filter's job of choosing the per-column control. Its other
    job — supplying a value type — survives and becomes the registry key.
    Update docs/manage-grid-pattern.md's meta.grid table in the same commit.

    IF THIS STORY EXCEEDS ITS CONTEXT, split it as: (a) the operator registry
    plus typed value controls, then (b) the bar, the URL codec and the popover
    removal.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.
    Assert per type: the right operators, the conditional value control, the
    reset on type change, the intersection case, a relative-date round-trip,
    that all four menu items are present, that an `is empty` condition survives
    a reload, that match-all and match-any both behave, and that f.location
    still round-trips.

- id: "7"
  title: Toolbar compaction, contextual bulk actions, and the current-view label
  description: >-
    CAP-6. One compact band carrying search, a filter control with an active
    indicator, the view label, column visibility and ordering, record creation,
    and visible result and selection counts — with the bulk bar appearing only
    on selection.
  invoke_dev_with: >-
    Read SPEC.md CAP-6, surface-and-toolbar.md, existing-state.md,
    docs/manage-grid-pattern.md, and epics.md Story 3.2. Most of this ALREADY
    EXISTS: grid-toolbar.tsx renders the globalFilter search with its clear X,
    the Columns visibility menu, the density Select, a rowAction slot, a
    toolbarExtra slot, and the visible/total counts;
    manage-contacts-table.tsx puts the selection count and the bulk-favourite
    button in toolbarExtra, and the bulk button is already disabled at zero.
    The work is compaction and hierarchy, not construction.

    YOUR FILTER ROLE IS NOW A COUNT, NOT A CONTROL. Story 3.1's filter surface
    is a permanent inline bar (OQ-18), so there is nothing left for a button to
    open. Show how many conditions are active; do NOT add an "open filter"
    control, which would be exactly the nonfunctional button CAP-6 forbids.

    THE STATUS MESSAGE CHANNEL MUST SURVIVE. grid.tsx:865 renders the grid's
    own live region, and story 5 of spec-grid-keyboard-editors-and-theme
    reports per-row delete outcomes through it. Any toolbar redesign that
    moves or drops that channel silently breaks the delete feature's
    feedback — and silent is the failure mode this suite is worst at catching.

    THE VIEW CONTROL IS A LABEL, NOT AN OBJECT (OQ-1). A control that looks
    like a view selector and cannot save a view is exactly the nonfunctional
    button the brief forbids. Either the label is honest, or the feature is
    deferred. Do not ship a dropdown of views that do not exist. Saved views
    need a table, a migration, a new /api/manage/* route that proxy.ts does
    not match, and a staff trust model public.users does not have.

    KEEP the selection count in the resting state, not only in the bulk bar: an
    operator needs to know a selection exists before acting on it. Bulk
    actions are contextual — a separate bar that appears on selection, not a
    permanent footer.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.

- id: "8"
  title: Page header, navigation, and scope
  description: >-
    CAP-1. Title and metadata form one unit, the scope indicator aligns to that
    unit, the active tab is unmistakable, and the header loses vertical height
    without cramping the tab row.
  invoke_dev_with: >-
    Read SPEC.md CAP-1, surface-and-toolbar.md section CAP-1,
    existing-state.md, and epics.md Story 3.3. This story is NEW in this
    reconciliation: CAP-1 had ZERO mentions across all eight stories of the
    previous breakdown, so the whole page-header redesign had no owner.

    manage-portal.tsx:58-141 is the whole header. The problems are spatial,
    not aesthetic: space-y-6 between header, scope notice, tab list and
    content; text-2xl sm:text-3xl bold Poppins for the title; a metadata line in
    plain text-sm; and the scope indicator in a separate `flex-col
    sm:items-end` block that lands in a different optical row from the title.

    TITLE AND METADATA ARE ONE UNIT. Title, then the scope line — staff name,
    contact count, location count — tight beneath it. The count is metadata
    about the PAGE, so it belongs with the page's name, not floating in the
    body. The scope indicator aligns to that unit's baseline, not to the bottom
    of a separate column. One block, one alignment.

    THE ACTIVE TAB MUST BE UNMISTAKABLE. Today TabsTrigger inherits shadcn's
    default active state, which is a subtle background. A tab strip where the
    active item must be inferred is a navigation failure. Use weight plus the
    existing --program-primary brand token — never a new colour.

    TIGHTEN space-y-6 without cramping. The tab list has `h-auto … flex-wrap`
    and the content follows at gap-4; the slack is in the header block above
    it. Five tabs are preserved in order, as MANAGE_VIEWS.

    ONE TOKEN FIX: the hover:bg-black/5 on the scope toggle links
    (manage-portal.tsx:84, :92) is invisible on a dark surface. hover:bg-
    foreground/5 resolves in both. It is a one-token fix inside a file this
    story already touches.

    LEAVE --program-primary HEADERS ALONE: text-white on a fixed dark brand
    colour is correct in both themes.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.

- id: "9"
  title: Record review panel
  description: >-
    CAP-5, CAP-7's panel surface and CAP-16's panel boundary. An action-column
    control opens a modular record panel with every field, editable ones
    committed through the existing write path, prev/next navigation, and grid
    state preserved.
  done_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md CAP-5 and CAP-7, record-review.md IN FULL, existing-state.md,
    and epics.md Story 4.1 before writing anything. This is the first genuinely
    new surface this grid has gained, and its failure modes are state loss,
    which no assertion catches unless the assertion is written first.

    OPEN IT FROM AN ACTION-COLUMN CONTROL, NOT A ROW CLICK (OQ-6). A
    double-click already means "edit this cell". Three controls call
    stopPropagation on pointerdown — the select checkbox at :796, the favorite
    star at :953, the delete control at :990 — and with no row-level handler
    that entire bug class disappears. Keep the three calls anyway: they also
    stop the grid's own cell focus from moving out from under a control.

    A SHEET, NOT A MODAL (OQ-3): CAP-5's success requires returning to the
    grid with filters, sort, column order, selection, scroll and the focused
    cell intact, and a sheet that keeps the grid visible makes that verifiable
    by eye.

    READ THE WHOLE RECORD, including fields hidden or scrolled off in the
    grid — a record review showing a subset is a second grid. Show read-only
    fields as visibly read-only. Render linked records as labels per story 3
    and link them to the EXISTING /manage?view=... routes, not new ones.
    Include the attendance history: payload.attendance already carries every
    record and the rollups are resolved, so it is already loaded. NO FETCH —
    CAP-9 forbids a second row store.

    NO DELETE INSIDE THE PANEL. Story 5 of spec-grid-keyboard-editors-and-
    theme ships delete in the row's action column with confirmation and per-row
    outcomes; a second path is a second confirmation flow that can disagree with
    the first.

    THERE IS NO DIRTY FLAG AND NO PROMPT. That was designed and then deleted
    when OQ-2 was resolved: blur commits, so an edit cannot be abandoned by
    clicking away and the prompt could never appear. Do not build it. If a
    future story adds one it is reintroducing a problem the user removed.

    NAVIGATE prev/next through the CURRENT FILTERED, SORTED order — the same
    order the operator is looking at. Do not re-derive it by re-sorting; the
    grid already holds the resolved row model. Disable the control at the
    ends, do not wrap. Arrow keys navigate, Escape closes, and Escape must not
    steal the key from an open editor — isGuardedTarget
    (use-grid-keyboard.ts:68) is the model. Opening the panel is NOT Enter:
    Enter is CAP-10's commit key and one key meaning two things is how edits
    get lost.

    WRITE FEEDBACK reuses handleCellCommit, so a rejected write reverts and
    shows the server's own message, and saving/saved/failed are three visibly
    distinct states (CAP-7). One validation story, one message. Do not invent a
    record-level save — the API has none.

    SCROLL IS THE ONE THAT BREAKS SILENTLY. It is not in the URL. If the panel
    is an overlay over an unmounted-then-remounted grid, scroll resets to top
    and every other preservation assertion still passes.

    NEW SEAMS ONLY, per record-review.md: data-record-panel,
    -record, -field="<columnId>", -saving, -nav="next|prev". Do NOT repurpose
    any data-grid-* attribute: e2e/fixtures/manage-grid.ts documents that
    contract and 21 specs outside this work depend on it.

    IF THIS STORY EXCEEDS ITS CONTEXT, split it as: (a) the read-only panel,
    then (b) editable fields plus save states.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.
    Specs: open, close, navigate, edit-and-save, failed-save revert and
    message, and grid state preserved across open/close. The dirty-close
    prompt spec is DELETED, not skipped.

- id: "10"
  title: Interaction boundaries, accessibility, and the recorded visual pass
  description: >-
    CAP-16, CAP-8 and CAP-9. Verifies the seven interaction boundaries hold
    together, that every control is labelled and keyboard-reachable, and that
    scope preservation still passes after all nine stories.
  done_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md CAP-8, CAP-9 and CAP-16, surface-and-toolbar.md, the "What
    must survive this work" list at the end of that file, and epics.md Story
    4.2. This is the closing gate, not new feature work.

    THE BOUNDARIES TO PROVE, each with the mechanism already in the source: a
    checkbox click activates neither an edit nor the panel (stopPropagation);
    a dropdown or popover interaction never triggers a double-click edit — THE
    NEW RISK, because with double-click as the only opener a double-click
    landing on a select editor's popover could open the editor AND fire the
    cell's handler, so the cell's handler must check the event target is not
    inside [data-grid-editor]; a read-only field never enters edit mode
    (openEditor's editable guard); editing never opens the panel (no row-level
    handler exists); a single click preserves row and record navigation;
    keyboard propagation is stopped only where a key would be swallowed
    (isGuardedTarget).

    THE THIRTEEN-ITEM TEST LIST from the brief maps across these stories.
    Everything is asserted except item 9, visual distinctness of hover /
    active / editing / selected, which the suite CANNOT check: banning shadows
    and stripes is exactly the CSS a spec would have to hardcode, and
    hardcoded values fail the first time someone tunes a token for dark-mode
    legibility. Record a manual pass at 1440x900 and 1024x768, in light and in
    whatever theme exists, in this story file.

    PRESERVATION GATES, all of which must still hold: grep -rn "dark:"
    components/grid/ is 0; the raw-hex / rgb( / white / black grep is 0; no
    Manage* or /api/manage vocabulary under components/grid/; every data-grid-*
    attribute in e2e/fixtures/manage-grid.ts still present and still meaning
    what that file documents; all 19 matrix rows still Covered, or each retired
    row's reason recorded in matrix-coverage-map.md in the same commit; apps/
    folk and apps/gita-life mirrored with md5sum on the files meant to match;
    pnpm typecheck:workspace, pnpm lint, pnpm guardrails and pnpm test:e2e
    green.

    ALSO AUDIT, because no story owns them on its own: every write still goes
    through lib/manage/api-handlers.ts with getStaffContext + requireRole,
    validated against MANAGE_CONTACT_PATCH_KEYS, with no component talking to
    Supabase directly and no new authorization logic; and there are NO per-
    option coloured pills — no eleven pastel hues, no stable-hash palette.
    Revisiting pills requires an explicit data-* assertion surface and a
    decision on whether tone belongs to the option or the field.

    Also confirm the non-regression rule: `e`, type-to-edit and Space-seeding
    STAY GONE. If story 1's behaviour has been quietly restored, say so rather
    than shipping a green suite that tests something nobody intended to keep.

    Do NOT mount ThemeProvider — story 6 of spec-grid-keyboard-editors-and-
    theme owns the theme and is unstarted. Never commit a deliberately broken
    spec to e2e/specs/; generate failures into a temp dir and remove them in a
    finally. One e2e runner at a time: every spec shares one seeded database
    and concurrent runs corrupt each other's fixtures.