- id: "7"
  title: Toolbar compaction, Hide fields, contextual bulk actions, and the Sort control
  description: >-
    CAP-6, CAP-17 and CAP-18. One compact band carrying search, a filter control
    that is also the active-state indicator, a Hide fields control, a global
    Sort control, record creation, and visible result and selection counts —
    with the bulk bar appearing only on selection. There is NO view label and
    NO view dropdown (OQ-1, resolved twice).
  invoke_dev_with: >-
    Read SPEC.md CAP-6, surface-and-toolbar.md, existing-state.md,
    docs/manage-grid-pattern.md, and epics.md Story 3.3. Most of this ALREADY
    EXISTS: grid-toolbar.tsx renders the globalFilter search with its clear X,
    the Columns visibility menu, the density Select, a rowAction slot, a
    toolbarExtra slot, and the visible/total counts;
    manage-contacts-table.tsx puts the selection count and the bulk-favourite
    button in toolbarExtra, and the bulk button is already disabled at zero.
    The work is compaction and hierarchy, not construction.

    YOUR FILTER CONTROL IS A BUTTON AGAIN, AND IT IS ALSO THE INDICATOR.
    Story 3.2's filter surface is a popover anchored under this control
    (OQ-18), so the toolbar button opens it — and when conditions are active
    the SAME control becomes the indicator, naming the columns it is filtering
    in saffron, e.g. "Filtered by Name, Phone". One control, two jobs; do not
    ship both a separate indicator and a separate trigger. This paragraph
    previously said the filter role was "a count, not a control" because the
    inline bar was permanent and there was nothing to open — that reasoning
    died with the inline bar. What still holds from it: never add a control
    that does not work, which is what CAP-6 forbids.

    THE STATUS MESSAGE CHANNEL MUST SURVIVE. grid.tsx:865 renders the grid's
    own live region, and story 5 of spec-grid-keyboard-editors-and-theme
    reports per-row delete outcomes through it. Any toolbar redesign that
    moves or drops that channel silently breaks the delete feature's
    feedback — and silent is the failure mode this suite is worst at catching.

    THERE IS NO VIEW CONTROL AT ALL — NOT EVEN A LABEL (OQ-1, RESOLVED TWICE).
    OQ-18's first answer was a static label over URL-backed view state. That
    answer is WITHDRAWN: a control that looks like a view selector but cannot
    save a view is closer to the nonfunctional button the brief forbids than to
    a real feature, and a static label is the worst version of that — it promises
    an object and delivers text. Ship NO view label and NO view dropdown. View
    state stays URL-backed (`q`, `sort`, `cols`, `hide`, `f.<colId>`) and is
    communicated through the filter indicator, the Hide fields control and the
    live result count — never through a view name. Saved views would need a
    table, a migration, a new /api/manage/* route that proxy.ts does not match,
    and a staff trust model public.users does not have. If a view name is ever
    added it must be a real stored object, not a label.

    KEEP the selection count in the resting state, not only in the bulk bar: an
    operator needs to know a selection exists before acting on it. Bulk
    actions are contextual — a separate bar that appears on selection, not a
    permanent footer.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.
    APPROVED COMPOSITION: Visual-Design/contacts-toolbar-stitch-v1-corrected.html
    The toolbar band and its control order. There is NO view label and NO view
    dropdown (OQ-1). Hide fields lives in the overlays comp.
    Read visual-design.md (a companion, and the binding) plus the Visual
    Design section of SPEC.md for the artifact index.

    CAP-18 - THE DEFAULT FIELD SET. Nine of fourteen columns visible, five
    hidden: hide Source, Books Read, Date of Birth, Last Contacted On and
    Favorite. This is a product decision recorded in SPEC.md, not a consequence
    of definition order. The Hide fields control IS the column-visibility
    surface - it REPLACES the existing Columns menu at grid-toolbar.tsx:130, so
    do not ship both. Name and Actions are hideable: false and must render
    ticked and disabled. Hiding is reversible and persists in the `hide` URL
    param, so the hidden set is a DEFAULT, NOT A LOCK - every one of the five
    stays reachable. Location and Collected By stay visible because they are
    the joined accessor columns, so CAP-4's unresolved marker is on screen
    rather than behind an unhide. Last Contacted On is hidden because OQ-16
    records it as written once at insert and never updated, so it reads as
    'created on' and would mislead. CAP-17's Sort control also lands here.


- id: "8"
  title: Page header, navigation, and scope
  description: >-
    CAP-1. Title and metadata form one unit, the scope indicator aligns to that
    unit, the active tab is unmistakable, and the header loses vertical height
    without cramping the tab row.
  invoke_dev_with: >-
    Read SPEC.md CAP-1, surface-and-toolbar.md section CAP-1,
    existing-state.md, and epics.md Story 3.4. This story is NEW in this
    reconciliation: CAP-1 had ZERO mentions across all eight stories of the
    previous breakdown, so the whole page-header redesign had no owner.

    manage-portal.tsx:58-141 is the whole header. The problems are spatial,
    not aesthetic: space-y-6 between header, scope notice, tab list and
    content; text-2xl sm:text-3xl bold Poppins for the title; a metadata line in
    plain text-sm; and the scope indicator in a separate `flex-col
    sm:items-end` block that lands in a different optical row from the title.

    TITLE AND METADATA ARE ONE UNIT. Title, then the scope line — staff name,
    contact count, location count — tight beneath it. The count is metadata
    about the PAGE, so it belongs with the page's name, not floating in the
    body. The scope indicator aligns to that unit's baseline, not to the bottom
    of a separate column. One block, one alignment.

    THE ACTIVE TAB MUST BE UNMISTAKABLE. Today TabsTrigger inherits shadcn's
    default active state, which is a subtle background. A tab strip where the
    active item must be inferred is a navigation failure. Use weight plus the
    existing --program-primary brand token — never a new colour.

    TIGHTEN space-y-6 without cramping. The tab list has `h-auto … flex-wrap`
    and the content follows at gap-4; the slack is in the header block above
    it. Five tabs are preserved in order, as MANAGE_VIEWS.

    ONE TOKEN FIX: the hover:bg-black/5 on the scope toggle links
    (manage-portal.tsx:84, :92) is invisible on a dark surface. hover:bg-
    foreground/5 resolves in both. It is a one-token fix inside a file this
    story already touches.

    LEAVE --program-primary HEADERS ALONE: text-white on a fixed dark brand
    colour is correct in both themes.

    Verify: pnpm typecheck:workspace, pnpm lint, pnpm guardrails, pnpm test:e2e.

