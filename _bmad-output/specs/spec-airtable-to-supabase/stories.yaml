# Story breakdown for SPEC-airtable-to-supabase.
# Execution order is list order. spec_checkpoint=true on every story (user decision, 2026-10-05,
# carried forward on the 2026-10-05 re-derive): a human reviews each story spec between planning
# and implementation. All dispatch notes carry the Supabase connection contract so agents work
# autonomously.
# Environment contract (2026-10-05): NO local Supabase stack. All work targets the hosted project
# etwunirahuucodcxydgs (ap-south-1) via gitignored .env files; migrations are applied with
# supabase db push against the linked hosted project. The hosted project is disposable
# pre-cutover — wipe/re-seed freely. The old project (cparpinmalqsimninyfw) and the Airtable
# base are read-only archives — never write to or delete them.
# Credentials: the full hosted-project credential set (anon/publishable/service-role keys,
# JWT secret, POSTGRES_* URLs and password) lives in the gitignored repo-root file
# .env.migration.local. Agents read values from there when CLI/Postgres access is needed;
# NEVER copy credential values into code, docs, spec artifacts, commits, or chat output.
# Rotation of this credential set is pending — treat it as temporary.

- id: "1"
  title: Schema migration — users table and contact field gaps
  description: >-
    Adds the Supabase-native public.users table covering all roles (Admin/Preacher/
    Volunteer/Assistant), replacing the Airtable Users source and the
    staff_memberships/staff_profiles/airtable_identities bridge, plus the missing contact
    columns
    (source, photo_path, rounds, books_read, is_favorite), computed attendance-count views,
    and a contact-photos storage bucket. Implements CAP-1, CAP-2 and the CAP-9 schema per
    SPEC.md and data-model-mapping.md.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read _bmad-output/specs/spec-airtable-to-supabase/SPEC.md plus companions
    data-model-mapping.md and rls-policy-matrix.md before writing anything.
    Work: create one new migration in supabase/migrations/ (do NOT edit
    20261004000000_create_core_tables.sql); a public.users table (generalized 2026-10-06 —
    ALL roles, not just staff/preachers; distinct from auth.users) with: id UUID PRIMARY KEY
    REFERENCES auth.users(id), program_id TEXT NOT NULL, email TEXT NOT NULL, name TEXT,
    role TEXT CHECK IN (Admin, Preacher, Volunteer, Assistant), status TEXT CHECK IN
    (Active, Inactive, Suspended, Revoked), location_ids UUID[], assigned_preacher_id UUID
    REFERENCES public.users(id), invited_by UUID, timestamps, UNIQUE(program_id, email) —
    per SPEC.md assumptions; ADD the FK constraints the core-tables
    migration left as plain UUIDs: sessions.preacher_id -> public.users(id),
    sessions.location_id -> locations(id), contacts.assigned_preacher_id and
    contacts.collected_by_id -> public.users(id) (CAP-1 requires Postgres-enforced FKs);
    contact columns source TEXT, photo_path TEXT,
    rounds TEXT, books_read TEXT[], is_favorite BOOLEAN DEFAULT false; a view (or views)
    exposing per-contact total_attendance_count and past_60_day_attendance_count from
    attendance (60-day rolling window, Asia/Kolkata); a PRIVATE contact-photos Supabase
    Storage bucket (signed-URL rendering — story 6). After the migration, regenerate
    lib/supabase/types.ts (supabase gen types against the linked hosted project). Keep
    audit_events untouched. ADD the users table alongside the existing bridge tables — do NOT
    drop staff_memberships/staff_profiles/airtable_identities in this story; they stay until
    the cleanup story so existing authz keeps working mid-migration.
    Supabase connection: never read env vars directly — server queries use
    createSupabaseServerClient() from lib/supabase/server.ts, service-role writes use
    createSupabaseAdminClient() from lib/supabase/admin.ts, browser code uses
    createSupabaseBrowserClient() from lib/supabase/client.ts; env resolution lives in
    lib/supabase/env.ts (URL: NEXT_PUBLIC_SUPABASE_URL with SUPABASE_URL fallback; browser
    key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY preferred, anon fallback; writes:
    SUPABASE_SERVICE_ROLE_KEY). There is no local
    stack: develop against the hosted project etwunirahuucodcxydgs via gitignored .env files.
    First CLI step: supabase link --project-ref etwunirahuucodcxydgs (SUPABASE_ACCESS_TOKEN
    is in .env.migration.local) — the project is not yet linked. Apply migrations with
    supabase db push on the linked project (fallback: --db-url with POSTGRES_URL_NON_POOLING),
    and wipe/re-seed freely —
    it is disposable pre-cutover. CLI/Postgres credentials are in the gitignored
    .env.migration.local at repo root — read values from there, never copy them anywhere.
    Never touch the old project (cparpinmalqsimninyfw).
    Do not touch RLS policies — that is story 2.

- id: "2"
  title: Scoped RLS policies on contacts, attendance, sessions, locations
  description: >-
    Replaces the placeholder authenticated-read-all policies with the per-role,
    program-scoped policies defined in rls-policy-matrix.md, backed by SECURITY DEFINER
    helper functions. Implements CAP-3.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md and rls-policy-matrix.md first — the matrix is the exact contract, do not
    invent new scoping. Work: new migration adding SECURITY DEFINER helpers
    (caller_program(), caller_role(), caller_effective_location_ids() resolving through
    assigned_preacher_id for Volunteer/Assistant) over the public.users table from story 1; then
    replace policies on contacts, locations, sessions, attendance: SELECT per the matrix
    (sessions scoped by created_by; contacts by assigned_preacher_id; attendance via the
    parent session's preacher; locations Admin-all or id = ANY(effective_location_ids));
    no authenticated INSERT/UPDATE/DELETE — writes stay service-role only. Also add the
    public.users policies from the matrix (Admin all-in-program; others own row only).
    Ship verification
    SQL (supabase/snippets/ or a test script) that proves per role per table that
    out-of-scope rows are unreadable with a user JWT. Verification needs seeded auth users —
    create fixtures via the service role (admin API): per program, 1 Admin, 1 Preacher, 1
    Volunteer + 1 Assistant assigned to that preacher, plus in-scope and out-of-scope
    contacts/locations/sessions/attendance rows; seed.sql is an empty stub, so ship the
    fixture script with the story. Every policy is also constrained by
    program_id. Connection contract: same as story 1 — lib/supabase accessors only, hosted
    project via gitignored .env, migrations via supabase db push; wipe/re-seed the hosted
    project freely, never touch the old project. Depends on story 1.

- id: "3"
  title: Supabase data-access module mirroring lib/airtable.ts
  description: >-
    Creates a Supabase-backed data module exporting the same function names and return
    shapes as lib/airtable.ts so route diffs in story 5 are import-only. Foundation for
    CAP-4.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md, data-model-mapping.md, and lib/airtable.ts first. Work: new module
    (lib/supabase/data.ts) exporting Supabase implementations of: findStaffUserByEmail,
    findStaffUserById, listActivePreachers (+ unstable_cache variant), upsertStaffUser,
    findContactByPhone, getContactsByRecordIds, createContact, findSessionById, listSessions,
    findLocationById, findLocationByName, listLocations (+ cached variant), createLocation,
    revalidate cache helper, createSession, updateSessionAttendanceUrl,
    findAttendanceByContactAndSession, createAttendanceRecord, getAttendanceByDate,
    getAttendanceBySession, getAttendanceBySessionRecord, getAttendanceByRecordIds,
    getAttendanceDashboardRecords,
    normalizeMobile. Preserve Asia/Kolkata date semantics and phone normalization exactly.
    Duplicate attendance detection moves to the UNIQUE(contact_id, session_id) index — map
    Postgres 23505 to the same duplicate signal callers get today. Provide Supabase-side
    equivalents of AirtableConfigError/AirtableRequestError where callers catch them; the
    mapContact/mapSession/mapLocation row mappers are internal — write Supabase row mappers
    as needed. syncStaffSupabaseUserId is NOT mirrored — story 4 deletes that path. IDs are
    now UUIDs; return
    shapes keep the same field names. Connection contract: lib/supabase accessors only
    (admin client for writes, server client for user-context reads), never env vars directly;
    hosted project via gitignored .env, no local stack. Depends on stories 1–2 migrations
    being pushed to the hosted project.

- id: "4"
  title: Authz rework — staff context resolves from Supabase
  description: >-
    Rewires lib/authz.ts so getStaffContext reads the public.users table and the
    Airtable sync path (findStaffUserByEmail / syncStaffSupabaseUserId round-trips) is
    deleted; audit_events logging is kept. Implements CAP-2.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md and lib/authz.ts first. Work: getStaffContext authenticates via Supabase
    Auth (unchanged), then loads the user row by (user_id, program_id) from the new
    public.users table; drop the staleness/refresh-to-Airtable machinery and the
    staff_memberships/staff_profiles/airtable_identities reads; keep AuthzError codes and
    writeAuditEvent behavior; StaffContext.airtableUserId becomes the public.users UUID —
    rename downstream semantics accordingly (callers updated in story 5). Sessions and
    dashboard scoping keep working: created_by / preacher scoping now compares against the
    users-table UUID. Connection contract: lib/supabase accessors only; hosted project via
    gitignored .env, no local stack. Depends on stories 1 and 3.

- id: "5"
  title: Route and page swap to Supabase in both apps
  description: >-
    Moves every route and page in apps/folk and apps/gita-life from lib/airtable to the new
    data module, updates rec*-ID validation to UUIDs, and preserves the /attendance and
    offline-queue contracts byte-for-byte. Implements CAP-4, CAP-5, CAP-6.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md, docs/api-contracts.md, and the companions first. Work: in BOTH apps/folk
    and apps/gita-life, swap imports to lib/supabase/data.ts in api routes (registration,
    contact, sessions, attendance, admin/locations, volunteers/invite, admin/invite-user,
    auth/signin) and pages (dashboard, manage, sessions, contact, admin/invite, volunteers).
    Update apps/*/app/attendance/route.ts parseKnownAttendanceIds (and any other rec* regex)
    to accept UUIDs. Hard preservation contracts: /attendance POST payload {mobile,
    sessionId} and responses (400 invalid, 404 notRegistered, 409 duplicate, 201 created)
    unchanged; GET dashboard role scoping (Admin all / Preacher own sessions / location /
    Assistant via assigned preacher) unchanged; the service worker's offline queue
    (QUEUED_POST_PATHS /api/contact, /api/registration, /registration, /attendance in
    public/sw.js; replay to the original URL; synthetic 202 {queued:true}; 409 counts as
    synced) keeps working unchanged — do NOT modify sw.js; proxy.ts and its matcher are
    untouched. The route/page list above is indicative, not exhaustive: grep for
    @/lib/airtable and @hkmc/airtable (12+ files per app, incl. api/auth/me and
    api/auth/complete-implicit if they import it) and swap every hit. Connection contract: lib/supabase accessors only. Depends on stories 3–4.

- id: "6"
  title: In-app /manage portal replacing the Airtable Interface
  description: >-
    Builds the Supabase-backed management portal at /manage per manage-interface.md:
    dashboard stats and charts, contacts table, location-grouped sessions, per-contact
    attendance history, and favorites/contact editing with photo upload. Implements CAP-9.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md, manage-interface.md, and rls-policy-matrix.md first — manage-interface.md
    is the screen-by-screen contract. Work: /manage stops redirecting to Airtable and renders
    the portal in the app's existing design language (see components/ patterns, e.g.
    live-attendance-dashboard.tsx); roles Admin + Preacher only; Admin sees program-wide
    aggregates with an admin/preacher mode toggle for their own data (app-layer filter, RLS
    unchanged), Preacher sees only their own data. Charts: dashboard stats (total contacts,
    contacts per quarter line, past-60-day attendance pie, sessions/attendance bars by
    preacher stacked by location with month/year filters) — use the project's chart approach
    and load the dataviz skill if chart code is written. Contact detail editing persists via
    server routes (service role); photo upload goes to the PRIVATE contact-photos bucket from
    story 1 — render via signed URLs minted server-side, never public URLs.
    Connection contract: lib/supabase accessors only. Depends on stories 1–4 —
    story 2's RLS policies are the portal's enforcement model (manage-interface.md assumes
    them for Preacher scoping).

- id: "7"
  title: Airtable removal and dependency cleanup
  description: >-
    Deletes lib/airtable.ts, packages/airtable, shared-airtable.ts, the @hkmc/airtable
    workspace deps, and all AIRTABLE_* env config, then proves the repo builds clean.
    Implements CAP-7.
  spec_checkpoint: true
  invoke_dev_with: >-
    Work: delete lib/airtable.ts, packages/airtable, packages/program-config shared-airtable
    config and the AIRTABLE table-ID resolution; remove "@hkmc/airtable" from
    apps/folk/package.json and apps/gita-life/package.json; strip AIRTABLE_* env vars (both
    FOLK_ and GITA_LIFE_ prefixes) from env files, deployment config, and docs. Also delete
    the dead lib/offline-sync.ts localStorage queue and its wiring
    (components/offline-sync-provider.tsx and its mount in components/providers.tsx) —
    saveOfflineRecord has no callers; the real offline path is public/sw.js, which stays.
    Also own playbook step 22: update docs/data-models.md, docs/architecture.md, and
    docs/api-contracts.md to the Supabase-only reality (docs/deployment-guide.md and
    docs/development-guide.md lose their AIRTABLE_* sections; scripts/deploy-vercel.mjs has
    an AIRTABLE_API_TOKEN preflight check to remove).
    Verify:
    grep -ri airtable over runtime code returns nothing outside docs/_bmad-output; pnpm
    build, lint, and typecheck pass with no AIRTABLE_* vars set. Do not delete
    supabase/migrations or docs/spec files. Connection contract: lib/supabase accessors only.
    Depends on stories 5–6 (nothing may still import Airtable).

- id: "8"
  title: Configure and verify the hosted Supabase project and preview deployment
  description: >-
    Pushes migrations and auth config to the already-provisioned, Vercel-linked hosted
    project (etwunirahuucodcxydgs), seeds test data, and runs the CAP-3/5/6 verification
    suite plus a PWA smoke test on the branch preview. Implements playbook Phase 4.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read SPEC.md and migration-playbook.md Phase 4 first. Project creation and the Vercel
    link are already DONE (user, 2026-10-05) — do not create or link projects. Work: supabase
    link --project-ref etwunirahuucodcxydgs (SUPABASE_ACCESS_TOKEN + POSTGRES_* are in the
    gitignored .env.migration.local — read, never copy), then push all
    migrations from supabase/migrations/ (supabase db push);
    configure auth site URL + redirect URLs for https://folk-hkmc-rho.vercel.app (OQ-10
    resolved) — and email templates
    from supabase/templates/ (only invite.html and magic-link.html exist);
    SMTP = Mailtrap sandbox (OQ-9 resolved): SMTP_* creds in .env.migration.local — sandbox
    captures mail in a test inbox and does NOT deliver to staff, which is fine for preview
    testing; flag the go-live swap in your report. NEVER `supabase config push` config.toml
    verbatim (its [auth] section is local-mailpit). Topology note (corrected 2026-10-06): the deployment users currently use is itself a
    PREVIEW on the old stack; THIS branch's deployment is the future production — it stays
    dark until cutover, so deploy freely during verification. Users are unaffected
    throughout. Seed test data using story 2's fixture script (per program: 1 Admin, 1
    Preacher, 1 Volunteer + 1 Assistant assigned to that preacher, in/out-of-scope
    contacts/locations/sessions/attendance) — wipe/re-seed freely, the hosted project is
    disposable pre-cutover. Then run verification
    on the preview: RLS per role per table (CAP-3), /attendance contract codes (CAP-5),
    offline queue replay incl. 409-as-synced (CAP-6), PWA install smoke test (on-device
    portion may need the human — script everything scriptable, hand off the rest). There is
    no pre-existing test suite in the repo; verification scripts ship with this story.
    Old Supabase
    project and both Airtable bases (folk appqea9DRLOXqErXb, gita-life appzbssqNK53yqjZH)
    are read-only archives — never write to or
    delete them. Depends on story 7.

- id: "9"
  title: Cutover — backfill, auth migration, delta sync, go-live
  description: >-
    Executes playbook Phase 5: one-time Airtable export/transform/load with a rec*→UUID
    mapping table, auth.users migration preserving UUIDs, delta sync from the old project,
    and go-live by distributing the migration branch deployment's link to users.
    Implements CAP-8's cutover half.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read migration-playbook.md Phase 5 first and follow it exactly. Old-project access (OQ-8
    fully resolved): OLD_SUPABASE_SERVICE_ROLE_KEY + OLD_POSTGRES_URL* are in
    .env.migration.local — use OLD_POSTGRES_URL_NON_POOLING (5432) for pg_dump, not the 6543
    transaction-mode pooler; the service-role key covers PostgREST reads (delta sync, count
    verification). Work: brief write freeze —
    from this point on the new project is NO LONGER disposable, the wipe permission was a
    pre-cutover development privilege only; page the Airtable REST API for BOTH bases (folk
    appqea9DRLOXqErXb, gita-life appzbssqNK53yqjZH; table IDs in
    packages/program-config/src/programs/*.ts; CSV export is a UI feature, not agent-able):
    contacts, attendance,
    sessions, locations, users/staff; transform with a persisted rec*→UUID mapping
    table; resolve free-text locations; fetch Airtable attachment photos into the
    contact-photos bucket; load via service role into the NEW project; verify counts per
    table per program. Direct Postgres access for LOAD steps uses
    POSTGRES_URL_NON_POOLING from the gitignored .env.migration.local (that URL is the NEW
    project only); the OLD-project dump uses the human-supplied credentials from the
    prerequisite. Migrate auth.users from the old project preserving UUIDs (auth schema
    dump/restore) and verify every staff member can sign in. Delta-sync rows created in the
    old project during the testing window (audit_events and any other new rows). Before
    go-live, swap the Mailtrap sandbox SMTP for a delivering sender (OQ-9 caveat — sandbox
    mail never reaches staff inboxes). Go live by
    distributing https://folk-hkmc-rho.vercel.app to users (OQ-10 resolved) — its env
    already resolves
    the new project, so there is no env flip; the old live deployment was itself a preview.
    Smoke-test /attendance, offline replay, dashboard scoping, sign-in on the new production. The old project and both Airtable bases stay read-only and
    preserved — no deletes. Big-bang: no dual-write. If any step lacks credentials or access,
    stop and report rather than improvising. Depends on story 8 passing all verification.
