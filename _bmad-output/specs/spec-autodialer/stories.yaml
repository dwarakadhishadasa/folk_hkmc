- id: "1-8"
  title: Conflict-aware weighted assignment write
  epic: 1
  depends_on: ["1-7"]
  frames: [324]
  description: >-
    The server pre-check that names every conflict, the skip/move choice, one
    transaction that writes only the confirmed set, floor + largest-remainder
    weights, auto-promotion, and named refusals for out-of-set or inactive
    callers.
  invoke_dev_with: >-
    DESIGN LINKS (1 frame in campaign.figcraft): figcraft://node/324

    Read SPEC.md CAP-5, ARCHITECTURE-SPINE.md AD-3, AD-11, AD-16,
    data-model.md dialer_assignments, architecture.md §1a, ux-flows.md §6,
    and epics.md Story 1.8.

    CONFLICTS ARE NAMED BEFORE ANY WRITE. The pre-check returns contact name +
    current caller for every selected contact already assigned in the campaign.
    Nothing is written until the assigner chooses skip or move. The primary
    button's count is the count that will actually be written (frame 324's
    "Assign 120 contacts" is this rule).

    THE UNIQUE KEY IS (contact_id, campaign_id). Assignment is a move: update
    the existing row, never insert a second one. The constraint is the
    backstop; the readable conflict list is the feature.

    WEIGHTS ARE WRITE-TIME ONLY. N = confirmed set size. Each caller gets
    floor(N × weight ÷ total weight); leftovers go one at a time to the largest
    remainders, ties by higher weight then list order. Counts must sum exactly
    to N. No weights column, no weights table.

    ONE TRANSACTION. Re-run the pre-check inside it, insert exactly the
    confirmed set, and roll the whole batch back on any failure. No partial
    success. Report offending rows by name. Out-of-set caller = 403 naming
    them; inactive existing caller = refused, never reactivated. DRAFT is
    allowed; COMPLETED/CANCELLED is refused.

    FIXTURES: you may reuse e2e/fixtures/bulk-contacts.ts, but restore any
    renamed fixture in a finally. The generator is idempotent on exact
    deterministic names; a left-renamed row breaks the next run before any test.

    Verify: pnpm test:static; pnpm test:e2e campaign-assign-write.

- id: "1-9"
  title: Campaign overview and the one progress computation
  epic: 1
  depends_on: ["1-8"]
  frames: [32, 790, 961, 1752]
  description: >-
    campaign_progress as the single source of funnel, mix, rollup, summary and
    activity numbers; the Overview stat cards and campaign table; scoped,
    fail-closed, queued-excluded.
  invoke_dev_with: >-
    DESIGN LINKS (4 frames in campaign.figcraft): figcraft://node/32, figcraft://node/790, figcraft://node/961, figcraft://node/1752

    Read SPEC.md CAP-8 and reporting constraints, ARCHITECTURE-SPINE.md AD-5,
    AD-16, data-model.md Reporting, and epics.md Story 1.9.

    DESIGN: frame 32 has five stat cards including Confirmed and the campaign
    table (CANCELLED, no row actions); 1752 is the phone Overview; 961 is dark
    parity; 790 shows Never attempted as the amber bucket. No campaign empty
    state is drawn — implement it (UX-DR24).

    ONE FUNCTION, ONE SET OF DEFINITIONS. campaign_progress returns the funnel,
    outcome mix by status_group, per-caller rollup, summary counts and recent
    activity. Attempted = at least one log; Reached = at least one log outside
    NOT_REACHABLE/WRONG_NUMBER; Confirmed = latest reached log is CONFIRMED;
    Never attempted = assigned − attempted. Funnel/campaign counts are
    assignment-grain; leaderboard/activity are log-grain. Never recompute a
    definition in the client.

    SECURITY: SECURITY INVOKER, SET search_path = public, pg_temp, EXECUTE
    revoked from PUBLIC/anon/authenticated, granted to service_role only. A
    program_scope=false with a null scope id raises; only Admin passes true. An
    Assistant with no preacher is refused before the call.

    A QUEUED DISPOSITION IS NOT COUNTED until replay. Say so in the UI; do not
    let the funnel look short without explanation.

    Verify: pnpm test:static; pnpm test:e2e campaign-overview. Do NOT re-test
    the reports screen — Story 3.1 consumes this function.

- id: "2-1"
  title: The caller queue, the call card, and contact history
  epic: 2
  depends_on: ["1-9"]
  frames: [2263, 2360, 2737]
  description: >-
    The caller-scoped queue payload, deterministic order, the call card with
    campaign context, progress, phone + Copy, the Queue drawer with current/next
    and jump, and the last-N cross-campaign contact history.
  invoke_dev_with: >-
    DESIGN LINKS (3 frames in campaign.figcraft): figcraft://node/2263, figcraft://node/2360, figcraft://node/2737

    Read SPEC.md CAP-1/CAP-6, ARCHITECTURE-SPINE.md AD-1, AD-7, AD-9, AD-16,
    calling-mechanism.md, ux-flows.md §2, §3 and §9, and epics.md Story 2.1.

    DESIGN: frame 2263 is the call card, frame 2360 is the queue, frame 2737 is
    a second card state. Frame 2737 HAS A KNOWN DEFECT: the primary button
    still says "Call Priya" while showing Sanjay K. The label must follow the
    current contact (UX-DR31). Do not copy the defect.

    THE QUEUE IS CALLER-GRAIN. Only PENDING assignments on ACTIVE campaigns,
    program-scoped, resolved through dialer_assignments → dialer_callers by
    caller_id, user_id and program_id. Order deterministically by campaign
    date, campaign, sort_order, assignment id. Another caller's id is 404 with
