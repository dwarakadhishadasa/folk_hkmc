# Story dispatch index for SPEC-autodialer.
#
# Consumed by bmad-build: `{spec_folder}/stories.yaml` + a `stories/{id}-*.md`
# file. A missing story file is expected — bmad-build derives one from the
# entry's title. The acceptance criteria live in `epics.md`; this file is the
# dispatch contract (scope, design links, dependencies, test economy).
#
# Every story inherits TP1–TP15 from epics.md § Additional Test Policy.

- id: "1-1"
  title: Dialer data model, generated status group, and RLS
  epic: 1
  depends_on: []
  frames: []
  spec_checkpoint: true
  description: >-
    The additive migration for seven dialer tables, the total generated
    status_group over the 13 design chips, the two unique keys, RESTRICT FKs,
    RLS through the existing helpers, the rls-policy-matrix row and regenerated
    types. dialer_survey_responses is deliberately deferred to 2.3 with the RPC.
  invoke_dev_with: >-
    DESIGN LINKS: none — no frame exists for this story; any required state is a design omission recorded in epics.md.

    Read SPEC.md constraints (program scope, contacts, disposition, inherited
    platform rules), data-model.md in full, ARCHITECTURE-SPINE.md AD-4, AD-11,
    AD-12, AD-13, AD-14, and epics.md Story 1.1. Read AGENTS.md and
    docs/architecture/testing.md before touching anything.

    This is the only story with no UI. It is not a "create all tables" story:
    seven tables are needed by the admin surface that follows, and the eighth
    (dialer_survey_responses) is intentionally created by Story 2.3 next to the
    RPC that writes it. Follow data-model.md exactly; do not add
    next_call_date, call_duration, audience_filter, follow_up_status or any
    speculative contact column. No new column on contacts.

    THE GENERATED COLUMN IS THE CONTRACT. status_group is
    GENERATED ALWAYS AS (CASE ...) STORED, NOT NULL, total over the 13 chips,
    and never written by the client or an RPC. The 13 labels are frame 2456's
    chips; the six groups are frame 790's buckets. If a chip has no group, the
    migration is wrong.

    GRANTS ARE THE OTHER HALF. Supabase grants every privilege to anon and
    authenticated on new public tables by default. Adding RLS policies does not
    remove those grants, so revoke INSERT/UPDATE/DELETE from anon and
    authenticated explicitly and grant SELECT only. No role holds DELETE.

    THE RESTRICT FKs COLLIDE WITH /manage. Do not change
    lib/supabase/manage.ts in this story — Story 1.3 owns the delete-message
    mapping while the full suite is already running for the header change.
    Here, only assert the FK refuses the delete.

    Verify: pnpm test:static; pnpm supabase:push (local only); pnpm seed:local.
    Record SQL probes for the generated column, both unique constraints, the
    grants, and each RESTRICT FK. Do NOT run pnpm test (zero tests), and do NOT
    run e2e — no UI exists and the suite would prove nothing about the schema.

- id: "1-2"
  title: The Campaign access boundary, and a guardrail that keeps it covered
  epic: 1
  depends_on: ["1-1"]
  frames: [32, 1752, 2217, 2263]
  spec_checkpoint: true
  description: >-
    requireCampaignAdmin, requireDialerCaller, campaignScope with the assignable
    caller set, the caller-scope assertion, the denial-sweep harness, the static
    route-coverage guardrail in pnpm guardrails, the Assistant e2e role, and the
    test:e2e:campaign script.
  invoke_dev_with: >-
    DESIGN LINKS (4 frames in campaign.figcraft): figcraft://node/32, figcraft://node/1752, figcraft://node/2217, figcraft://node/2263

    Read SPEC.md constraints on the caller boundary and route split,
    ARCHITECTURE-SPINE.md AD-2, AD-3, AD-7, AD-8, AD-14, architecture.md §2 and
    §2a, and epics.md Story 1.2.

    THE SPLIT IS STRUCTURAL, NOT REMEMBERED. /api/dialer/caller/** calls
    requireDialerCaller (any active caller) and then
    assertCallerAssignmentInScope. /api/dialer/admin/** calls
    requireCampaignAdmin (Admin/Preacher/Assistant) and then campaignScope.
    Never one guard for both populations. The caller id comes from
    getStaffContext(), never the request.

    THE CALLER PATH RETURNS 404 FOR BOTH CASES. A missing assignment and
    another caller's assignment must be indistinguishable. The admin surface may
    keep 403 vs 404. A failure returns no row and no id.

    SCOPE HAS NO FALLBACK. campaignScope returns { kind: "program" } for Admin,
    { kind: "preacher", userId } for Preacher, and the Assistant's preacher id.
    A Preacher or Assistant with no id is 403; it never widens. The same helper
    returns the assignable caller set: Admin the program; Preacher their
    assignees plus themselves; Assistant their preacher's assignees plus
    themselves; inactive callers excluded everywhere.

    THE STATIC GATE IS THE POINT. scripts/verify-dialer-route-coverage.mjs
    runs inside pnpm guardrails, enumerates every route file under
    apps/folk/app/api/dialer/**, and fails when one has no denial-sweep row.
    With zero routes it passes vacuously; prove it fails against a temporary
    unlisted route, then remove that route. Never commit a deliberately broken
    spec under e2e/specs/.

    ASSISTANT ROLE: the seeder already writes
    suresh.kannan@folk.fixture.test. Add the role to e2e/fixtures/roles.ts, add
    e2e/auth/assistant.setup.ts, add the setup project to playwright.config.ts,
    and add `test:e2e:campaign` to package.json. Harness-guards asserts only
    that test:e2e contains the readiness gate; adding a script is safe.

    Verify: pnpm test:static; pnpm guardrails; pnpm test:e2e dialer-route;
    pnpm test:e2e:list campaign-. Determinism is DELIBERATELY DEFERRED to Story
    4.2 even though this story edits the role fixture and playwright.config.ts:
    Story 1.3's full run immediately exercises the changed harness, and Story
    4.2 runs determinism over the accumulated suite. Running it here would add
    two full suites (~12 min) for a change the next full run already proves.
    Record the deferral in the story file. Do NOT re-run smoke — the sweep owns
    denial cases and smoke owns sign-in.

