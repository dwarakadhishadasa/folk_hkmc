- id: "1-4"
  title: Create a campaign, and move it through its lifecycle
  epic: 1
  depends_on: ["1-2"]
  frames: [32, 212, 1752]
  description: >-
    The campaign create/edit form with gap duration and max_attempts, the DRAFT
    default, the explicit DRAFT→ACTIVE / ACTIVE→COMPLETED / ACTIVE→CANCELLED /
    DRAFT→CANCELLED transitions, terminal 409s, and the campaign table/status.
  invoke_dev_with: >-
    DESIGN LINKS (3 frames in campaign.figcraft): figcraft://node/32, figcraft://node/212, figcraft://node/1752

    Read SPEC.md CAP-2 and lifecycle constraints, ARCHITECTURE-SPINE.md AD-12,
    data-model.md dialer_campaigns, UX flows, and epics.md Story 1.4.

    DESIGN: frame 212 is the form (name, description, end date, survey step),
    frame 32 is the campaign table (including CANCELLED, no row actions), frame
    1752 is the phone card. THE FRAME OMITS THREE REQUIRED THINGS: the gap
    duration control, max_attempts, and Start/Complete/Cancel. Implement all
    three; they are UX-DR17/18, not optional. Presets 5/10/20/30/60, default 20,
    range 5–300; a value outside the presets must still render as the current
    value.

    LIFECYCLE IS EXPLICIT. A new campaign is DRAFT. Only the four transitions
    exist; COMPLETED and CANCELLED are terminal in v1. Every transition is a
    conditional update on the current status, so a lost race is 409, never a
    double-apply. A DRAFT campaign must not look like a live campaign with an
    empty queue. Assignments and survey edits are allowed in DRAFT.

    Server-side refusal is required even though the UI hides controls. The
    form uses useState + hand-written handlers + fetch; no react-hook-form, no
    zod.

    Verify: pnpm test:static; pnpm test:e2e campaign-campaigns. Do NOT run the
    full suite — only campaign files changed.

