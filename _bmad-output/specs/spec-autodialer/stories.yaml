- id: "2-2"
  title: Pacing, Skip, Pause, campaign switch, single tab, and resume
  epic: 2
  depends_on: ["2-1"]
  frames: [2263, 2360]
  description: >-
    Date.now-derived gap countdown gating the call button, Skip writing SKIPPED,
    Pause as a normal state, the awaited campaign-switch notice, the
    BroadcastChannel/localStorage second-tab lock, and reload recovery.
  invoke_dev_with: >-
    DESIGN LINKS (2 frames in campaign.figcraft): figcraft://node/2263, figcraft://node/2360

    Read SPEC.md CAP-6, ARCHITECTURE-SPINE.md AD-9, AD-12, calling-mechanism.md
    §The gap timer, ux-flows.md §3, §4, §5, and epics.md Story 2.2.

    THE FRAMES SHOW NEITHER CONTROL. Frames 2263/2360 have no Skip, no Pause,
    no countdown and no switch notice. They are required design omissions
    (UX-DR4, UX-DR8, UX-DR19, UX-DR20), not optional polish.

    THE GAP MUST NOT DRIFT. Derive it from Date.now() against a target
    timestamp, never a decrementing counter. The tab is backgrounded for the
    whole call, so throttling is the normal case. The gap gates the CALL BUTTON,
    not navigation: the next card is readable immediately. Presets 5/10/20/30/60,
    default 20, range 5–300; an off-preset value still renders as current.

    SKIP WRITES. SKIPPED is a real assignment state here. Bound the last row;
    the source app crashed there. Skip must never drop a contact silently.
    Pause is a normal state and must not look like an error (no red error dot).

    THE SWITCH NOTICE IS AWAITED. It names the incoming campaign and date,
    pauses the gap, and blocks the next call until dismissed. The source fired
    it without await and dialled mid-fade.

    ONE SESSION: unique (assignment_id, attempt) is the database guarantee; a
    BroadcastChannel lock with a localStorage fallback is the courtesy. Refuse
    the second tab loudly.

    RESUME: /campaigns/assignments?campaign=<id> plus a re-fetch restores the
    same contact and in-flight draft. Do not keep the queue only in memory.

    Verify: pnpm test:static; pnpm test:e2e campaign-session. Do NOT run
    theme-switch or grid-*.

- id: "2-3"
  title: The disposition screen and the one-transaction save
  epic: 2
  depends_on: ["2-2"]
  frames: [2456]
  spec_checkpoint: true
  description: >-
    The 13-chip disposition screen with notes always and the campaign survey
    only when reached; the second migration adding dialer_survey_responses; the
    service-role-only, SECURITY INVOKER, idempotent record_call_disposition.
  invoke_dev_with: >-
    DESIGN LINKS (1 frame in campaign.figcraft): figcraft://node/2456

    Read SPEC.md CAP-7 and the disposition constraints, ARCHITECTURE-SPINE.md
    AD-4, AD-6, AD-12, data-model.md record_call_disposition and
    dialer_survey_responses, ux-flows.md §1, §3, §10, and epics.md Story 2.3.

    DESIGN: frame 2456 is "How did it go?" with the 13 Status chips, Notes and
    "Save & continue". The survey below Status is a required omission
    (UX-DR21). The chips ARE the stored model (UX-DR16): copy the labels
    exactly, including "Not interested — do not call again".

    SURVEY IS CONDITIONAL. It renders only when the selected group is not
    NOT_REACHABLE and not WRONG_NUMBER. Notes always render. An is_required
    answer is enforced by the RPC, or the marker is not rendered.

    ONE TRANSACTION, OR NOTHING. record_call_disposition is SECURITY INVOKER,
    search_path pinned, EXECUTE revoked from PUBLIC/anon/authenticated and
    granted to service_role only. It re-reads the assignment, refuses an
    inactive caller, snapshots dial_phone from contacts, writes the call log,
    its responses and the assignment status together. Idempotent on
    (assignment_id, attempt): same payload 200 with the stored row, different
    payload 409 changing nothing, never 500.

    ATTEMPT IS SUPPLIED, NOT INVENTED. Accept only the next attempt or an
    existing attempt owned by the same caller. called_at is insert-only. The
    caller id is getStaffContext(), never the payload.

    THIS IS THE SECOND MIGRATION: dialer_survey_responses with unique
    (call_log_id, question_id), its RLS matrix row, regenerated types.

    Verify: pnpm test:static; pnpm test:e2e campaign-disposition. If a spec
    holds the PATCH open with page.route, await the release before unroute —
