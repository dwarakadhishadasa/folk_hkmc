- id: "2-4"
  title: Save receipts, failure states, and named refusals
  epic: 2
  depends_on: ["2-3"]
  frames: [2456]
  description: >-
    Persistent Saving/Saved/Queued/Save failed receipt, answers kept on failure,
    and named blocking states for deactivated caller, reassigned assignment,
    cancelled campaign, second tab, and the Assistant wrong-number help.
  invoke_dev_with: >-
    DESIGN LINKS (1 frame in campaign.figcraft): figcraft://node/2456

    Read SPEC.md CAP-7/CAP-9, ARCHITECTURE-SPINE.md AD-7, AD-10,
    architecture.md §5, ux-flows.md §1, §8, §11, and epics.md Story 2.4.

    THE RECEIPT IS NOT A TOAST. It is persistent on the disposition screen:
    Saving…, Saved 12:04, Queued — will send, Save failed — session paused. A
    disappearing toast is not a guarantee a caller can trust mid-conversation.

    QUEUED IS SUCCESS. A network gap must never render Save failed. A rejected
    or failed write is loud, pauses the session, and keeps every answer
    editable/retryable.

    REFUSALS ARE NAMED, NOT GENERIC. Cross-tab, deactivated caller, reassigned
    assignment and cancelled campaign each get their own blocking message. The
    session pauses and answers are kept. The denial sweep needs the inactive
    caller row in Story 4.1; make the state reachable here.

    WRONG-NUMBER HELP: an Assistant who cannot edit a contact sees "Ask an
    Admin or Preacher", not a /manage link that fails. That is UX-DR28/FR46.

    Frames 2456 is the only design for this screen; the receipt and refusal
    states are required omissions, not a descope.

    Verify: pnpm test:static; pnpm test:e2e campaign-receipts. Do NOT re-test
    the offline queue; Story 2.5 owns it.

- id: "2-5"
  title: Offline disposition queue and draft recovery
  epic: 2
  depends_on: ["2-4"]
  frames: [2456]
  spec_checkpoint: true
  description: >-
    The disposition path in sw.js Background Sync, the 202 queued contract,
    drain on ok||409, the localStorage draft keyed by assignment/attempt, and
    surfacing an unsaved draft next session.
  invoke_dev_with: >-
    DESIGN LINKS (1 frame in campaign.figcraft): figcraft://node/2456

    Read SPEC.md the offline constraint, ARCHITECTURE-SPINE.md AD-10,
    architecture.md §5, public/sw.js (the one root file), AGENTS.md's sw.js
    contract note, and epics.md Story 2.5.

    ONE SERVICE WORKER. apps/folk/public and apps/gita-life/public are symlinks
    to ../../public. Add /api/dialer/caller/disposition to QUEUED_POST_PATHS and
    /campaigns to NETWORK_ONLY_PATH_PREFIXES in the root public/sw.js. Do not
    add any other dialer path; the queue must not capture attendance,
    registration or contact traffic.

    THE 202 CONTRACT IS SHARED. A queued response is
    { success: false, queued: true, message } and four existing files depend on
    it. Do not change its shape. The receipt reads "Queued — will send".

    DRAIN: ok || 409. A 200 replay must not duplicate the call log (the RPC is
    idempotent). A permanent refusal returns 409 so the frozen queue drains; the
    localStorage draft remains the recovery record, keyed
    dialer:disposition:<assignmentId>:<attempt>, and is surfaced next session
    as a call that could not be saved. Discard it when assignment or attempt
    changes, or when the write is confirmed.

    NO APP-SHELL OFFLINE PROMISE. The tab must already be open. Say so in the
    story file rather than implying more.

    Verify: pnpm test:static; pnpm test:offline-queue (existing 19-row contract
    gate, stack up); pnpm test:e2e campaign-offline; pnpm test:e2e:guards (21 s).
    Do NOT run the full suite for a sw.js-only change — no §5 shared component
    changed.

- id: "2-6"
  title: Session summary and caller-grain recall
  epic: 2
  depends_on: ["2-5"]
  frames: []
  description: >-
    The session-complete summary with the caller's own counts, recall of only
    their NOT_REACHABLE rows within max_attempts, closed-after-N reporting,
    attempt not bumped, and terminal 409 on a non-ACTIVE campaign.
  invoke_dev_with: >-
    DESIGN LINKS: none — no frame exists for this story; any required state is a design omission recorded in epics.md.

    Read SPEC.md CAP-6, ARCHITECTURE-SPINE.md AD-5, AD-12, data-model.md
    attempt cap and recall, ux-flows.md §3a, and epics.md Story 2.6.

    THERE IS NO FRAME. The summary and recall are a required design omission
    (UX-DR7, UX-DR23). Build from ux-flows §3a: counts, "Re-queue those N and
    continue", "Done — back to my queue".

    CALLER-GRAIN, DECIDED (D1). The counts are this caller's own work for the
    campaign, not campaign_progress's campaign-wide numbers. Do not repurpose
    campaign_progress; use the caller-scoped read the queue already proves.
    Another caller's NOT_REACHABLE row is absent from the count and cannot be
    recalled (404).

    RECALL IS BOUNDED. Only NOT_REACHABLE (CALL_DID_NOT_CONNECT, SWITCHED_OFF)
    returns to PENDING. Reached and WRONG_NUMBER are never re-queued. attempt is
    not bumped; the next call log is the next attempt. max_attempts (default 3)
    counts logs; at the cap report "closed after N attempts" rather than
    vanishing. A non-ACTIVE campaign returns terminal 409.

    Verify: pnpm test:static; pnpm test:e2e campaign-summary. Do NOT re-run
    campaign-reports; that is campaign-grain and Story 3.1 owns it.

